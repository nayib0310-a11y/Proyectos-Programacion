<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Académico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="body-login">
        <div class="login-container">
            <img src="{{ url_for('static', filename='IMAGENES/unnamed-removebg-preview.png') }}" alt="Logo de la Institución" class="logo">
            
            <h3>UNEFA EXCELENCIA EDUCATIVA</h3>

            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            
            <form method="POST">
                <div class="input-group">
                    <i class="fas fa-users-cog"></i>
                    <select name="rol" required>
                        <option value="" disabled selected>SELECCIONE SU ROL</option>
                        <option value="estudiantes">Estudiante</option>
                        <option value="docentes">Docente</option>
                        <option value="coordinadores">Coordinador</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="usuario" placeholder="Usuario" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                
                <button type="submit" class="login-button">INGRESAR AL SISTEMA</button>
            </form>
            
        </div>
    </div>

    <footer class="footer-siceu">
        <img src="{{ url_for('static', filename='IMAGENES/200.png') }}" alt="Logo Izquierda" class="footer-logo">
        <p>SICEU 2026 Universidad Nacional Experimental Politécnica de la Fuerza Armada</p>
        <img src="{{ url_for('static', filename='IMAGENES/gob.png') }}" alt="Logo Derecha" class="footer-logo">
    </footer>

</body>
</html>
