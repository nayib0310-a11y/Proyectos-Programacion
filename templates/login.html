{% extends "base.html" %}

{% block title %}Iniciar Sesión - Sistema Académico{% endblock %}

{% block content %}
    <div class="auth-container">
        <h2>Iniciar Sesión</h2>
        
        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Iniciar Sesión</button>
        </form>
        
        <div class="auth-links">
            <p>¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
        </div>
    </div>
{% endblock %}

{% block styles %}{% endblock %}
