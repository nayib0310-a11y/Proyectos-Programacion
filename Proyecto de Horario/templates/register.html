{% extends "base.html" %}

{% block title %}Registrarse - Sistema Académico{% endblock %}

{% block content %}
    <div class="auth-container">
        <h2>Crear Cuenta</h2>
        
        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="fullname">Nombre Completo:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" minlength="4" placeholder="Mínimo 4 caracteres" autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
            </div>
            
            <div class="form-group">
                <label for="role">Rol en el sistema:</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Seleccione un rol...</option>
                    <option value="student">Estudiante</option>
                    <option value="teacher">Profesor</option>
                    <option value="coordinator">Coordinador</option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Registrarse</button>
        </form>
        
        <div class="auth-links">
            <p>¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
        </div>
    </div>
{% endblock %}

{% block styles %}{% endblock %}
