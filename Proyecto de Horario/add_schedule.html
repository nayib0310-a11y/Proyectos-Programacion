{% extends "base.html" %}

{% block content %}
    <h2>Agregar Nuevo Horario</h2>
    <form method="POST" action="{{ url_for('coordinator_dashboard') }}">
        <div class="form-group">
            <label for="teacher">Profesor:</label>
            <select id="teacher" name="teacher" required>
                {% for teacher in teachers %}
                    <option value="{{ teacher.fullname }}">{{ teacher.fullname }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Materia:</label>
            <select id="subject" name="subject" required>
                {% for subject in subjects %}
                    <option value="{{ subject.name }}">{{ subject.name }} ({{ subject.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="day">Día:</label>
            <select id="day" name="day" required>
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
            </select>
        </div>
        <div class="form-group">
            <label for="start_time">Hora de inicio:</label>
            <input type="time" id="start_time" name="start_time" required>
        </div>
        <div class="form-group">
            <label for="end_time">Hora de fin:</label>
            <input type="time" id="end_time" name="end_time" required>
        </div>
        <div class="form-group">
            <label for="semester">Semestre:</label>
            <input type="text" id="semester" name="semester" required>
        </div>
        <div class="form-group">
            <label for="classroom">Aula:</label>
            <input type="text" id="classroom" name="classroom" required>
        </div>
        <button type="submit">Guardar Horario</button>
        <a href="{{ url_for('coordinator_dashboard') }}" class="button">Cancelar</a>
    </form>
{% endblock %}

{% block styles %}
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #35424a;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #35424a;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c3e50;
        }
    </style>
{% endblock %}
